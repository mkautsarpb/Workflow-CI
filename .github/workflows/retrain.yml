name: MLflow CI Retraining

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install MLflow & DagsHub
        run: |
          pip install "mlflow<3" dagshub

      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/mkautsarpb/Workflow-CI.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER_NAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow run MLProject
