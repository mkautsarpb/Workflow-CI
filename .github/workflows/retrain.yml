name: MLflow CI Retraining

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  train-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install MLflow
      run: |
        pip install mlflow

    - name: Run MLflow Project (Retrain)
      run: |
        mlflow run MLProject

    - name: Upload Model Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: mlruns

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Install Docker dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y docker.io

    - name: Build Docker Image via MLflow
      run: |
        mlflow build-docker MLProject \
          --name ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/heart-disease-mlflow
