name: MLflow CI Retraining

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install MLflow & DagsHub
        run: |
          pip install "mlflow<3" dagshub

      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/mkautsarpb/Workflow-CI.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER_NAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow run MLProject

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image from MLflow model
        run: |
          mlflow models build-docker \
            -m runs:/latest/model \
            -n mkautsar/heart-disease-mlflow

      - name: Push Docker image
        run: |
          docker push mkautsar/heart-disease-mlflow
